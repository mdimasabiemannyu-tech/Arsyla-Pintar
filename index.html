<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Petualangan Pintar Anak</title><style>body{margin:0;font-family:Arial;background:linear-gradient(135deg,#8ed6ff,#ffe58f);min-height:100vh;text-align:center;color:#25324a}.app{max-width:850px;margin:auto;padding:20px}.box{background:white;border-radius:28px;padding:24px;box-shadow:0 12px 35px #0002;margin-top:20px}h1{font-size:clamp(30px,7vw,55px);margin:8px}button{border:0;border-radius:18px;padding:16px 22px;margin:8px;font-size:20px;font-weight:bold;cursor:pointer}.cat{min-width:180px;background:#f0f4ff}#question{font-size:110px;font-weight:900;min-height:150px;display:flex;align-items:center;justify-content:center}#image{font-size:125px;min-height:145px;display:flex;align-items:center;justify-content:center}.mic{background:#ff6b6b;color:white}.next{background:#58d39a}.back{background:#7785ff;color:white}.score{font-size:22px;font-weight:bold}#status{font-size:24px;font-weight:bold;min-height:38px}.hidden{display:none}.small{font-size:14px;color:#667}</style></head><body><div class="app"><h1>🌟 Petualangan Pintar Anak 🌟</h1><p>Lihat, dengarkan, lalu <b>katakan jawabannya!</b> 🎤</p><div id="menu" class="box"><h2>Pilih Permainan</h2><button class="cat" onclick="start('angka')">🔢 Angka</button><button class="cat" onclick="start('huruf')">🔤 Huruf</button><button class="cat" onclick="start('buah')">🍎 Buah</button><button class="cat" onclick="start('hewan')">🐶 Hewan</button><p class="small">Gunakan Chrome/Edge dan izinkan mikrofon.</p></div><div id="game" class="box hidden"><div class="score">⭐ Skor: <span id="score">0</span> | Soal: <span id="num">1</span></div><div id="question"></div><div id="image"></div><div id="status">Katakan jawabanmu...</div><button class="mic" onclick="listen()">🎤 Jawab Sekarang</button><button class="next" onclick="nextQuestion()">➡️ Soal Berikutnya</button><button class="back" onclick="goMenu()">🏠 Menu</button></div></div><script>const data={angka:[['1','Satu'],['2','Dua'],['3','Tiga'],['4','Empat'],['5','Lima'],['6','Enam'],['7','Tujuh'],['8','Delapan'],['9','Sembilan'],['10','Sepuluh']],huruf:[['A','A'],['B','B'],['C','C'],['D','D'],['E','E'],['F','F'],['G','G'],['H','H'],['I','I'],['J','J']],buah:[['🍎','Apel'],['🍌','Pisang'],['🍊','Jeruk'],['🍉','Semangka'],['🍇','Anggur'],['🥭','Mangga'],['🍍','Nanas'],['🍓','Stroberi'],['🥥','Kelapa'],['🍐','Pir']],hewan:[['🐱','Kucing'],['🐶','Anjing'],['🐘','Gajah'],['🐯','Harimau'],['🦁','Singa'],['🐮','Sapi'],['🐔','Ayam'],['🐟','Ikan'],['🐰','Kelinci'],['🐒','Monyet']]};let cat='',items=[],i=0,score=0,n=1;const $=x=>document.getElementById(x),norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'');function start(c){cat=c;items=[...data[c]].sort(()=>Math.random()-.5);i=0;score=0;n=1;$('menu').classList.add('hidden');$('game').classList.remove('hidden');show()}function show(){let x=items[i];$('score').textContent=score;$('num').textContent=n;$('question').textContent=cat==='angka'||cat==='huruf'?x[0]:'';$('image').textContent=cat==='buah'||cat==='hewan'?x[0]:'';$('status').textContent='Katakan jawabanmu...'}function listen(){if(!('webkitSpeechRecognition'in window||'SpeechRecognition'in window)){ $('status').textContent='Browser belum mendukung mikrofon. Gunakan Chrome/Edge.';return}let R=window.SpeechRecognition||window.webkitSpeechRecognition,r=new R();r.lang='id-ID';r.interimResults=false;r.maxAlternatives=3;$('status').textContent='🎧 Mendengarkan...';r.onresult=e=>{let heard=e.results[0][0].transcript,target=items[i][1],ok=norm(heard).includes(norm(target));if(ok){score+=10;$('status').textContent='🎉 Hebat! Benar!';speak('Hebat! Jawaban kamu benar!')}else{$('status').textContent='😊 Coba lagi ya!';speak('Coba lagi ya')}};r.onerror=()=>{$('status').textContent='🎤 Mikrofon tidak terdengar. Tekan lagi.'};r.start()}function speak(t){if(speechSynthesis){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='id-ID';speechSynthesis.speak(u)}}function nextQuestion(){i=(i+1)%items.length;n++;show()}function goMenu(){$('game').classList.add('hidden');$('menu').classList.remove('hidden')}</script></body></html>
