<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#6C63FF">
<title>Arsyla Pintar 🌟</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:linear-gradient(135deg,#78dcff,#c8f5ce,#ffe38a);
  min-height:100vh;
  color:#27334d;
}

.app{
  width:100%;
  max-width:720px;
  margin:auto;
  padding:18px 15px 30px;
}

.header{text-align:center;padding:8px 0}

.logo{
  font-size:clamp(34px,9vw,56px);
  font-weight:1000;
  color:#5b4de8;
  text-shadow:3px 3px #fff;
}

.tagline{
  font-size:17px;
  font-weight:bold;
}

.card{
  background:#fffffff2;
  border-radius:30px;
  padding:20px;
  margin-top:18px;
  box-shadow:0 14px 35px #0002;
}

.welcome{
  text-align:center;
}

.welcomeEmoji{
  font-size:75px;
  animation:float 2.5s infinite ease-in-out;
}

@keyframes float{
  50%{transform:translateY(-10px)}
}

.menuTitle{
  font-size:28px;
  font-weight:900;
  margin:5px 0 18px;
}

.menuButton{
  width:100%;
  border:0;
  border-radius:22px;
  min-height:75px;
  margin:9px 0;
  font-size:22px;
  font-weight:900;
  box-shadow:0 6px #0002;
}

.menuButton:active{
  transform:translateY(5px);
  box-shadow:0 1px #0002;
}

.angka{background:#ffe17c}
.huruf{background:#bce7ff}
.suku{background:#d4c4ff}
.baca{background:#ffb9c5}
.pintar{background:#b6efc8}

.hidden{display:none!important}

/* GAME */

.gameTop{
  display:flex;
  justify-content:space-between;
  gap:7px;
  font-weight:900;
  font-size:15px;
}

.topBox{
  padding:9px 11px;
  border-radius:15px;
}

.score{background:#fff0a5}
.level{background:#d9d0ff}
.life{background:#ffd6de}

.progress{
  height:11px;
  background:#e7eaf2;
  border-radius:20px;
  margin:15px 0;
  overflow:hidden;
}

.progressBar{
  width:10%;
  height:100%;
  background:#6c63ff;
  border-radius:20px;
  transition:.4s;
}

.stars{
  text-align:center;
  font-size:28px;
  margin:5px;
}

.listen{
  text-align:center;
}

.soundButton{
  width:78px;
  height:78px;
  border:0;
  border-radius:50%;
  background:#ff7070;
  color:#fff;
  font-size:38px;
  box-shadow:0 6px #d94f4f;
}

.soundButton:active{
  transform:translateY(5px);
  box-shadow:0 1px #d94f4f;
}

.soundText{
  font-size:13px;
  color:#6d7688;
  font-weight:bold;
  margin-top:7px;
}

.question{
  text-align:center;
  font-size:25px;
  font-weight:1000;
  margin:18px 0 5px;
}

.visual{
  min-height:150px;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-wrap:wrap;
  gap:8px;
  font-size:75px;
  padding:10px;
}

.bigText{
  font-size:105px;
  font-weight:1000;
  color:#5b4de8;
}

.wordPicture{
  font-size:100px;
}

/* ANSWERS */

.answers{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:13px;
  margin-top:10px;
}

.answer{
  min-height:120px;
  border:0;
  border-radius:23px;
