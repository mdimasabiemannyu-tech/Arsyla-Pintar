<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#6c63ff">
<title>Arsyla Pintar 🌟</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #74d8ff, #ffe58a);
  min-height: 100vh;
  color: #26324a;
}

.container {
  max-width: 700px;
  margin: auto;
  padding: 18px;
  text-align: center;
}

.logo {
  font-size: 42px;
  font-weight: 900;
  margin: 10px 0 3px;
}

.subtitle {
  font-size: 18px;
  font-weight: bold;
}

.card {
  background: white;
  border-radius: 28px;
  padding: 22px;
  margin-top: 20px;
  box-shadow: 0 12px 30px rgba(0,0,0,.15);
}

h2 {
  margin-top: 5px;
}

.menu button {
  display: block;
  width: 100%;
  margin: 12px 0;
  padding: 18px;
  border: 0;
  border-radius: 20px;
  font-size: 22px;
  font-weight: bold;
  cursor: pointer;
  background: #f1f4ff;
  box-shadow: 0 5px 0 rgba(0,0,0,.08);
}

.menu button:active {
  transform: translateY(4px);
  box-shadow: none;
}

.angka {
  background: #ffe082 !important;
}

.huruf {
  background: #b8f2c8 !important;
}

.buah {
  background: #ffb7b7 !important;
}

.hewan {
  background: #c5c6ff !important;
}

.score {
  font-size: 20px;
  font-weight: bold;
  margin-bottom: 15px;
}

.question {
  font-size: 26px;
  font-weight: bold;
  margin: 10px 0;
}

.visual {
  min-height: 150px;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 105px;
  flex-wrap: wrap;
  gap: 5px;
  padding: 10px;
}

.number-big {
  font-size: 120px;
  font-weight: 900;
}

.letter-big {
  font-size: 120px;
  font-weight: 900;
}

.answers {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-top: 15px;
}

.answer {
  border: 0;
  border-radius: 18px;
  padding: 18px 10px;
  font-size: 24px;
  font-weight: bold;
  background: #eef2ff;
  cursor: pointer;
  box-shadow: 0 5px 0 rgba(0,0,0,.08);
}

.answer:active {
  transform: translateY(4px);
  box-shadow: none;
}

.message {
  min-height: 50px;
  margin: 15px 0 5px;
  font-size: 25px;
  font-weight: 900;
}

.correct {
  color: #16a05d;
}

.wrong {
  color: #e55353;
}

.next {
  width: 100%;
  border: 0;
  border-radius: 18px;
  padding: 16px;
  margin-top: 15px;
  font-size: 21px;
  font-weight: bold;
  background: #59d99a;
  cursor: pointer;
}

.home {
  width: 100%;
  border: 0;
  border-radius: 18px;
  padding: 14px;
  margin-top: 10px;
  font-size: 18px;
  font-weight: bold;
  background: #7b82ff;
  color: white;
  cursor: pointer;
}

.hidden {
  display: none;
}

.stars {
  font-size: 30px;
  letter-spacing: 5px;
}

.footer {
  margin-top: 20px;
  font-size: 14px;
  opacity: .7;
}
</style>
</head>

<body>

<div class="container">

  <div class="logo">🌟 ARSYLA PINTAR 🌟</div>
  <div class="subtitle">Belajar • Bermain • Berani Menjawab</div>

  <!-- MENU -->
  <div id="menu" class="card menu">

    <h2>🎮 Pilih Permainan</h2>

    <button class="angka" onclick="mulai('angka')">
      🔢 Belajar Angka
    </button>

    <button class="huruf" onclick="mulai('huruf')">
      🔤 Belajar Huruf
    </button>

    <button class="buah" onclick="mulai('buah')">
      🍎 Belajar Buah
    </button>

    <button class="hewan" onclick="mulai('hewan')">
      🐯 Belajar Hewan
    </button>

  </div>


  <!-- GAME -->
  <div id="game" class="card hidden">

    <div class="score">
      ⭐ Skor: <span id="score">0</span>
      &nbsp;&nbsp;
      📖 Soal: <span id="nomor">1</span>/10
    </div>

    <div class="stars" id="stars">☆☆☆☆☆</div>

    <div id="question" class="question"></div>

    <div id="visual" class="visual"></div>

    <div id="answers" class="answers"></div>

    <div id="message" class="message"></div>

    <button id="nextButton" class="next hidden" onclick="soalBerikutnya()">
      ➡️ Soal Berikutnya
    </button>

    <button class="home" onclick="kembaliMenu()">
      🏠 Kembali ke Menu
    </button>

  </div>

  <div class="footer">
    🌈 Arsyla Pintar — Belajar sambil bermain
  </div>

</div>


<script>

const data = {

  angka: [
    ["1","Satu"],
    ["2","Dua"],
    ["3","Tiga"],
    ["4","Empat"],
    ["5","Lima"],
    ["6","Enam"],
    ["7","Tujuh"],
    ["8","Delapan"],
    ["9","Sembilan"],
    ["10","Sepuluh"]
  ],

  huruf: [
    ["A","A"],
    ["B","B"],
    ["C","C"],
    ["D","D"],
    ["E","E"],
    ["F","F"],
    ["G","G"],
    ["H","H"],
    ["I","I"],
    ["J","J"]
  ],

  buah: [
    ["🍎","Apel"],
    ["🍌","Pisang"],
    ["🍊","Jeruk"],
    ["🍉","Semangka"],
    ["🍇","Anggur"],
    ["🥭","Mangga"],
    ["🍍","Nanas"],
    ["🍓","Stroberi"],
    ["🥥","Kelapa"],
    ["🍐","Pir"]
  ],

  hewan: [
    ["🐱","Kucing"],
    ["🐶","Anjing"],
    ["🐘","Gajah"],
    ["🦁","Singa"],
    ["🐯","Harimau"],
    ["🐮","Sapi"],
    ["🐔","Ayam"],
    ["🐟","Ikan"],
    ["🐰","Kelinci"],
    ["🐒","Monyet"]
  ]

};


let kategori = "";
let soal = [];
let posisi = 0;
let skor = 0;
let sudahMenjawab = false;


function acak(array) {

  return [...array].sort(() => Math.random() - 0.5);

}


function mulai(kat) {

  kategori = kat;

  soal = acak(data[kat]);

  posisi = 0;

  skor = 0;

  document.getElementById("menu").classList.add("hidden");

  document.getElementById("game").classList.remove("hidden");

  tampilkanSoal();

}


function tampilkanSoal() {

  sudahMenjawab = false;

  const item = soal[posisi];

  const question = document.getElementById("question");

  const visual = document.getElementById("visual");

  const answers = document.getElementById("answers");

  const message = document.getElementById("message");

  const nextButton = document.getElementById("nextButton");


  question.textContent = "";

  visual.innerHTML = "";

  answers.innerHTML = "";

  message.textContent = "";

  message.className = "message";

  nextButton.classList.add("hidden");


  document.getElementById("score").textContent = skor;

  document.getElementById("nomor").textContent = posisi + 1;


  if (kategori === "angka") {

    question.textContent = "🔢 Angka berapakah ini?";

    visual.innerHTML =
      `<div class="number-big">${item[0]}</div>`;

  }

  else if (kategori === "huruf") {

    question.textContent = "🔤 Huruf apakah ini?";

    visual.innerHTML =
      `<div class="letter-big">${item[0]}</div>`;

  }

  else if (kategori === "buah") {

    question.textContent = "🍎 Buah apakah ini?";

    visual.textContent = item[0];

  }

  else if (kategori === "hewan") {

    question.textContent = "🐯 Hewan apakah ini?";

    visual.textContent = item[0];

  }


  let pilihan = [item[1]];


  while (pilihan.length < 4) {

    const acakItem =
      data[kategori][
        Math.floor(Math.random() * data[kategori].length)
      ][1];

    if (!pilihan.includes(acakItem)) {

      pilihan.push(acakItem);

    }

  }


  pilihan = acak(pilihan);


  pilihan.forEach(jawaban => {

    const button = document.createElement("button");

    button.className = "answer";

    button.textContent = jawaban;

    button.onclick = () => cekJawaban(jawaban);

    answers.appendChild(button);

  });

}


function cekJawaban(jawaban) {

  if (sudahMenjawab) return;

  sudahMenjawab = true;

  const benar = soal[posisi][1];

  const message = document.getElementById("message");

  const nextButton = document.getElementById("nextButton");


  if (jawaban === benar) {

    skor += 10;

    message.innerHTML =
      "🎉 Hebat! Anak Pintar! ⭐";

    message.className =
      "message correct";

    document.getElementById("score").textContent = skor;

    buatBintang();

  }

  else {

    message.innerHTML =
      "😊 Tidak apa-apa, coba lagi!";

    message.className =
      "message wrong";

  }


  nextButton.classList.remove("hidden");

}


function buatBintang() {

  let jumlah = Math.min(5, Math.floor(skor / 20));

  let hasil = "";

  for (let i = 0; i < 5; i++) {

    hasil += i < jumlah ? "⭐" : "☆";

  }

  document.getElementById("stars").textContent = hasil;

}


function soalBerikutnya() {

  if (posisi < soal.length - 1) {

    posisi++;

    tampilkanSoal();

  }

  else {

    selesai();

  }

}


function selesai() {

  document.getElementById("question").textContent =
    "🏆 Permainan Selesai!";

  document.getElementById("visual").innerHTML =
    `<div style="font-size:80px">🎉⭐🎉</div>`;

  document.getElementById("answers").innerHTML = "";

  document.getElementById("message").innerHTML =
    `Hebat! Anak Pintar! 🌟<br>Skor kamu: ${skor}`;

  document.getElementById("message").className =
    "message correct";

  document.getElementById("nextButton").classList.add("hidden");

}


function kembaliMenu() {

  document.getElementById("game").classList.add("hidden");

  document.getElementById("menu").classList.remove("hidden");

}

</script>

</body>
</html>
